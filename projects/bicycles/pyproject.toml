[project]
name = "bicycle-collisions-canada"
version = "0.1.0"
description = "Analysis of Canada's public NCDB bicycle collision records"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.6", "openpyxl==3.1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
